<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>HSK 5 · Flash Cards · Offline · Local Storage · v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff6548;--accent-soft:#fff1ed;--text:#17181b;--muted:#68707d;
  --line:#dfe3e8;--bg:#fff;--surface:#fff;--surface2:#f7f7f8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Google Sans","Roboto","Noto Sans SC",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:block;max-width:900px;margin:auto;padding:18px 16px 40px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.4px}
.brand span{color:var(--accent)}
.spacer{flex:1}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);border-radius:15px;cursor:pointer}
.hero{padding:4px 0 18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase}
.hero h1{margin:5px 0 5px;font-size:30px;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted)}
.chapterGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chapter{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;
  text-align:left;cursor:pointer;min-height:94px;color:var(--text)}
.chapter:hover{border-color:var(--accent)}
.chapter b{display:block;font-family:"Noto Sans SC";font-size:15px}
.chapter small{display:block;color:var(--muted);margin-top:5px;line-height:1.35}
.studyHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.studyTitle{font-family:"Noto Sans SC";font-size:22px;font-weight:700;letter-spacing:-.3px}
.backBtn{margin-left:auto;border:1px solid var(--text);background:var(--text);color:var(--bg);
  border-radius:13px;padding:10px 17px;font-weight:700;cursor:pointer;white-space:nowrap}
.backBtn:hover{background:var(--accent);border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:transparent;color:var(--muted);padding:12px 10px 13px;
  cursor:pointer;font-weight:650;position:relative}
.tab.active{color:var(--accent)}
.tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;
  border-radius:99px;background:var(--accent)}
.randomTools{display:flex;justify-content:flex-end;min-height:42px;margin:-5px 0 10px}
.shuffleBtn{border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:12px;padding:9px 13px;font-weight:600;cursor:pointer}
.shuffleBtn:hover{border-color:var(--accent);color:var(--accent)}
.cardWrap{perspective:1400px}
.cardWrap.swipe-next{animation:cardSlideNext .22s cubic-bezier(.22,.72,.2,1)}
.cardWrap.swipe-prev{animation:cardSlidePrev .22s cubic-bezier(.22,.72,.2,1)}
@keyframes cardSlideNext{0%{transform:translateX(28px);opacity:.72}55%{opacity:1}100%{transform:translateX(0);opacity:1}}
@keyframes cardSlidePrev{0%{transform:translateX(-28px);opacity:.72}55%{opacity:1}100%{transform:translateX(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.cardWrap.swipe-next,.cardWrap.swipe-prev{animation:none}}
.card{position:relative;min-height:500px;touch-action:pan-y;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.2,.72,.2,1);
  cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);border-radius:26px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.frontContent{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.word{font-family:"Noto Sans SC";font-size:64px;font-weight:600;line-height:1.15;letter-spacing:1px}
.hint{font-size:14px;color:var(--muted)}
.swipeText{font-size:13px;color:var(--muted);margin-top:1px}
.cardCounter{position:absolute;top:14px;right:16px;z-index:3;font-size:11px;line-height:1;color:var(--muted);font-weight:600;letter-spacing:.2px;pointer-events:none}
@media(max-width:430px){.cardCounter{top:12px;right:13px;font-size:10px}.swipeText{font-size:12px}}
.backface{transform:rotateY(180deg)}
.backContent{width:min(88%,620px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:10px}
.backContent .word{font-size:42px}
.py{font-size:21px;color:var(--muted)}
.meaning{font-size:25px;font-weight:650}
.source{margin-top:5px;padding:7px 11px;border-radius:10px;background:var(--accent-soft);
  color:#d94e39;font-size:13px;font-weight:700}
.sentence{margin-top:9px;font-family:"Noto Sans SC";font-size:22px;line-height:1.55}
.note{color:var(--muted);font-size:13px;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{min-height:58px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:17px;cursor:pointer;font-size:18px;font-weight:550}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.38;cursor:default}
.reset{width:100%;margin-top:11px;min-height:48px;color:#a52d20;border-color:#ead8d4;font-size:15px}
.empty{color:var(--muted);padding:30px 0}
.hidden{display:none!important}
body.dark{--text:#f3f4f6;--muted:#aab2bf;--line:#2b2d31;--bg:#000;--surface:#151618;--surface2:#101113;--accent-soft:#2b1915}
html.dark{--bg:#000;background:#000}
body.dark .backBtn{background:#f3f4f6;color:#111;border-color:#f3f4f6}
body.dark .source{color:#ff8d78}
@media(max-width:700px){
  .chapterGrid{grid-template-columns:1fr 1fr}
  .card{min-height:500px}
}
@media(max-width:430px){
  .app{padding:14px 12px 32px}
  .top{margin-bottom:20px}
  .studyTitle{font-size:20px}
  .backBtn{padding:9px 13px}
  .word{font-size:54px}
  .card{min-height:470px}
  .face{border-radius:23px;padding:22px}
  .backContent .word{font-size:36px}
  .meaning{font-size:23px}
  .sentence{font-size:19px}
  .btn{min-height:56px;font-size:17px}
}
</style>

<style id="compact-v5">
/* Compact study view: keep the whole deck usable without page scrolling */
body.study-active .app { padding-top: 10px; padding-bottom: 12px; }
body.study-active .top { margin-bottom: 8px; }
body.study-active .studyHead { margin-bottom: 4px; }
body.study-active .tabs { margin-bottom: 5px; }
body.study-active .bottomTools { min-height: 40px; margin-top: 7px; display:flex; justify-content:center; }
body.study-active .card {
  min-height: min(58vh, 420px);
  max-height: 58vh;
}
body.study-active .face {
  min-height: 0;
  height: 100%;
  padding: 18px;
}
body.study-active .frontContent { gap: 10px; }
body.study-active .word { font-size: clamp(44px, 9vw, 58px); }
body.study-active .hint { font-size: 12px; }
body.study-active .backContent { gap: 6px; }
body.study-active .backContent .word { font-size: clamp(30px, 7vw, 38px); }
body.study-active .py { font-size: 17px; }
body.study-active .meaning { font-size: 21px; }
body.study-active .source { margin-top: 2px; padding: 5px 9px; font-size: 12px; }
body.study-active .sentence { margin-top: 3px; font-size: clamp(17px, 4vw, 20px); }
body.study-active .actions { margin-top: 7px; gap: 8px; }
body.study-active .btn { min-height: 47px; border-radius: 14px; font-size: 16px; }
body.study-active .bottomTools .shuffleBtn,
body.study-active .bottomTools .reset {
  width:100%; max-width:360px; min-height:43px;
}
body.study-active .bottomTools .reset {
  color:#a52d20; border-color:#ead8d4; font-size:15px;
}

@media (max-height: 800px) {
  body.study-active .top { margin-bottom: 4px; }
  body.study-active .studyHead { margin-bottom: 2px; }
  body.study-active .tabs { padding-bottom: 0; }
  body.study-active .card { min-height: 53vh; max-height: 53vh; }
  body.study-active .actions { margin-top: 5px; }
  body.study-active .bottomTools { margin-top: 5px; }
}
@media (max-width: 430px) {
  body.study-active .app { padding: 8px 12px 10px; }
  body.study-active .top { margin-bottom: 4px; }
  body.study-active .brand { font-size: 18px; }
  body.study-active .iconbtn { width: 40px; height: 40px; }
  body.study-active .studyTitle { font-size: 18px; }
  body.study-active .backBtn { padding: 7px 11px; font-size: 14px; }
  body.study-active .tab { padding: 8px 8px 9px; font-size: 14px; }
  body.study-active .shuffleBtn { padding: 6px 10px; font-size: 13px; }
  body.study-active .card { min-height: 51vh; max-height: 51vh; }
  body.study-active .face { border-radius: 20px; padding: 14px; }
}


</style>



<style id="top-actions-ui">
.topActions{display:flex;align-items:center;gap:8px;position:relative}
@media(max-width:430px){.topActions{gap:6px}}
</style>

<style id="footer-dark-fix">html,body{min-height:100%;background:var(--bg)}body.dark{background:#000}#home,#study{background:transparent}.app{background:transparent}</style>


</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">HSK 5 <span>· Flash Cards</span></div>
    <div class="spacer"></div>
    <div class="topActions">
      <button class="iconbtn" id="theme" aria-label="Tema">◐</button>
    </div>
  </header>

  <main id="home">
    <section class="hero">
      <div class="eyebrow">第1课 — 第16课</div>
      <h1>Flash Cards HSK 5</h1>
      <p>Pilih bab untuk mulai belajar kosa kata.</p>
    </section>
    <div class="chapterGrid" id="chapters"></div>
  </main>

  <main id="study" hidden>
    <div class="studyHead">
      <div class="studyTitle" id="studyTitle"></div>
      <button class="backBtn" id="back">Kembali</button>
    </div>

    <nav class="tabs" aria-label="Mode kartu">
      <button class="tab active" id="orderedTab">Berurutan</button>
      <button class="tab" id="randomTab">Acak</button>
    </nav>

    <section class="cardWrap">
      <div class="card" id="card" tabindex="0" aria-label="Kartu kosa kata">
        <div class="face front">
          <div class="cardCounter" id="cardCounterFront">1/1</div>
          <div class="frontContent">
            <div class="word" id="word"></div>
            <div class="hint">Ketuk kartu untuk membalik</div>
            <div class="swipeText">Swipe untuk berpindah kartu</div>
          </div>
        </div>
        <div class="face backface">
          <div class="cardCounter" id="cardCounterBack">1/1</div>
          <div class="backContent">
            <div class="word" id="backWord"></div>
            <div class="py" id="backPy"></div>
            <div class="meaning" id="meaning"></div>
            <div class="source" id="source"></div>
            <div class="sentence" id="sentence"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="btn" id="prev">← Sebelumnya</button>
      <button class="btn primary" id="next">Selanjutnya →</button>
    </div>


    <div class="bottomTools">
      <button class="shuffleBtn" id="shuffle">↻ Acak ulang</button>
      <button class="btn reset" id="reset">Reset posisi bab</button>
    </div>
  </main>
</div>

const STORAGE_PREFIX="hsk5_flashcards_offline_v1:";
// Progress is stored locally on this device/browser. The HTML file itself is never modified.
const STORAGE_SCHEMA=1;
let saved={last:{},randomOrder:{},theme:"light"};
function localKey(){return STORAGE_PREFIX+"guest"}
function loadLocalSaved(){
  try{
    const x=JSON.parse(localStorage.getItem(localKey())||"{}");
    saved={
      schema:Number(x.schema||STORAGE_SCHEMA),
      last:x.last||{},
      randomOrder:x.randomOrder||{},
      theme:x.theme==="dark"?"dark":"light"
    };
  }catch(e){
    saved={schema:STORAGE_SCHEMA,last:{},randomOrder:{},theme:"light"};
  }
}
function saveLocal(){
  try{
    saved.schema=STORAGE_SCHEMA;
    localStorage.setItem(localKey(),JSON.stringify(saved));
  }catch(e){}
}


let chapter=null;
let mode="ordered";
let index=0;
let order=[];
let flipped=false;

const $=id=>document.getElementById(id);
const home=$("home"), study=$("study"), card=$("card");

function save(){saveLocal();}

function chapterKey(){
  return chapter ? String(chapter.id) : "";
}
function positionKey(){
  return chapterKey()+"_"+mode;
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildRandomOrder(force=false){
  const key=chapterKey();
  if(!force && Array.isArray(saved.randomOrder[key]) && saved.randomOrder[key].length===chapter.cards.length){
    order=saved.randomOrder[key].slice();
    return;
  }
  order=shuffle(chapter.cards.map((_,i)=>i));
  saved.randomOrder[key]=order.slice();
  saved.last[positionKey()]=0;
  index=0;
  save();
}
function getCard(){
  const realIndex=order[index] ?? index;
  return chapter.cards[realIndex];
}
function setTabUI(){
  $("orderedTab").classList.toggle("active",mode==="ordered");
  $("randomTab").classList.toggle("active",mode==="random");
  $("shuffle").classList.toggle("hidden",mode!=="random");
  $("reset").classList.toggle("hidden",mode==="random");
}
function renderCard(){
  const c=getCard();
  if(!c)return;
  const progress=`${index+1}/${order.length}`;
  $("cardCounterFront").textContent=progress;
  $("cardCounterBack").textContent=progress;
  $("word").textContent=c.word;
  $("backWord").textContent=c.word;
  $("backPy").textContent=c.pinyin||"";
  $("meaning").textContent=c.meaning||"";
  $("source").textContent=c.source==="lesson" ? "★ 课文" : "☆ Tambahan";
  $("sentence").textContent=c.sentence||"";
  flipped=false;
  card.classList.remove("flipped");
  $("prev").disabled=index<=0;
  $("next").disabled=index>=order.length-1;
  saved.last[positionKey()]=index;
  save();
}
function openChapter(id){
  chapter=DATA.find(x=>x.id===id);
  if(!chapter)return;
  mode="ordered";
  order=chapter.cards.map((_,i)=>i);
  index=Number(saved.last[positionKey()]||0);
  $("studyTitle").textContent=`第${chapter.id}课 · ${chapter.title}`;
  home.hidden=true; study.hidden=false; document.body.classList.add("study-active");
  setTabUI();
  renderCard();
  window.scrollTo({top:0,behavior:"instant"});
}
function switchMode(nextMode){
  mode=nextMode;
  if(mode==="ordered"){
    order=chapter.cards.map((_,i)=>i);
  }else{
    buildRandomOrder(false);
  }
  index=Number(saved.last[positionKey()]||0);
  if(index<0 || index>=order.length)index=0;
  setTabUI();
  renderCard();
  window.scrollTo({top:0,behavior:"instant"});
}
function flip(){
  flipped=!flipped;
  card.classList.toggle("flipped",flipped);
}
function animateCardMove(direction){
  const wrap=card.closest(".cardWrap");
  if(!wrap)return;
  wrap.classList.remove("swipe-next","swipe-prev");
  void wrap.offsetWidth;
  wrap.classList.add(direction === "next" ? "swipe-next" : "swipe-prev");
  wrap.addEventListener("animationend",()=>{
    wrap.classList.remove("swipe-next","swipe-prev");
  },{once:true});
}
function next(){
  if(index<order.length-1){
    animateCardMove("next");
    index++;
    renderCard();
  }
}
function prev(){
  if(index>0){
    animateCardMove("prev");
    index--;
    renderCard();
  }
}
function goBack(){
  study.hidden=true; home.hidden=false; chapter=null; document.body.classList.remove("study-active");
  window.scrollTo({top:0,behavior:"instant"});
}
function resetChapter(){
  if(!chapter)return;
  const ok=confirm(`Reset posisi Bab ${chapter.id}? Kartu akan kembali ke awal di mode Berurutan dan Acak.`);
  if(!ok)return;
  delete saved.last[String(chapter.id)+"_ordered"];
  delete saved.last[String(chapter.id)+"_random"];
  delete saved.randomOrder[String(chapter.id)];
  mode="ordered";
  order=chapter.cards.map((_,i)=>i);
  index=0;
  save();
  setTabUI();
  renderCard();
}
function renderChapters(){
  $("chapters").innerHTML=DATA.map(c=>`
    <button class="chapter" data-id="${c.id}">
      <b>第${c.id}课 · ${c.title}</b>
      <small>${c.cards.length} kosa kata</small>
    </button>`).join("");
  document.querySelectorAll(".chapter").forEach(b=>{
    b.addEventListener("click",()=>openChapter(Number(b.dataset.id)));
  });
}
function applyTheme(){
  document.body.classList.toggle("dark",saved.theme==="dark");
  document.documentElement.classList.toggle("dark",saved.theme==="dark");
  $("theme").textContent=saved.theme==="dark"?"☀":"◐";
  document.querySelector('meta[name="theme-color"]').setAttribute("content",saved.theme==="dark"?"#000000":"#ffffff");
}
$("theme").addEventListener("click",()=>{
  saved.theme=saved.theme==="dark"?"light":"dark"; save(); applyTheme();
});
$("back").addEventListener("click",goBack);
$("orderedTab").addEventListener("click",()=>switchMode("ordered"));
$("randomTab").addEventListener("click",()=>switchMode("random"));
$("shuffle").addEventListener("click",()=>{
  if(mode!=="random")return;
  buildRandomOrder(true);
  renderCard();
});
$("prev").addEventListener("click",prev);
$("next").addEventListener("click",next);
$("reset").addEventListener("click",resetChapter);
let touchStartX=0;
let touchStartY=0;
card.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});
card.addEventListener("touchend",e=>{
  if(!touchStartX && !touchStartY)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  touchStartX=0; touchStartY=0;
  if(Math.abs(dx)<60 || Math.abs(dx)<=Math.abs(dy))return;

  // Cancel the browser's synthetic click generated by the swipe.
  // This prevents the swipe from consuming the user's next real tap.
  e.preventDefault();
  if(dx<0) next(); else prev();
},{passive:false});
card.addEventListener("click",()=>{
  flip();
});
card.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}
});
document.addEventListener("keydown",e=>{
  if(study.hidden)return;
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft")prev();
  if(e.key==="Escape")goBack();
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden") saveLocal();
});
window.addEventListener("pagehide",saveLocal);

loadLocalSaved();
renderChapters();
applyTheme();
window.scrollTo({top:0,behavior:"instant"});
</script>
</body>
</html>
